name = "zikaron-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Share links live on the site's own domain: zikaron.reembir.com/m/<slug>
# is answered by this Worker (the subdomain is proxied through Cloudflare;
# everything else on it is still GitHub Pages). The API stays on
# workers.dev too, so keep that enabled.
workers_dev = true
routes = [
  { pattern = "zikaron.reembir.com/m/*", zone_name = "reembir.com" },
]

# Non-secret configuration. Secrets (the Google service account key) are
# set separately — see the README — never put them here, since this file
# is committed to the repo.
[vars]
FIREBASE_PROJECT_ID = "zikaron-93b28"
ALLOWED_ORIGIN = "https://zikaron.reembir.com"
# Where share links (/m/<slug>) send people after giving social networks
# the page's preview.
PUBLIC_SITE_URL = "https://zikaron.reembir.com"
# reem.bi SSO — every API request's Bearer token is verified against
# REEM_AUTH_ORIGIN/api/userinfo. REEM_CLIENT_ID is this site's id in the
# reem.bi dashboard.
REEM_AUTH_ORIGIN = "https://login.reembir.com"
REEM_CLIENT_ID = "zikaron"
